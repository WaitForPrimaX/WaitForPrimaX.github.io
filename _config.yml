title: PrimaX
description: "文章与随笔"
baseurl: ""
url: "https://waitforprimax.github.io"
timezone: Asia/Shanghai
future: true

author:
  name: Sammy
  url: https://waitforprimax.github.io

remote_theme: chesterhow/tale

