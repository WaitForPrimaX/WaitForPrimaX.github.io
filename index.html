<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrimaX</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10140f;
      --ink: #f3f0e7;
      --muted: #b7b1a3;
      --line: #2a3128;
      --accent: #d6ff4a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(214, 255, 74, 0.16), transparent 60%),
        var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 18vh 1.5rem 4rem;
    }
    p.kicker {
      margin: 0 0 0.75rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 0.9;
    }
    p.lead {
      margin: 1.5rem 0 0;
      max-width: 28rem;
      font-size: 1.25rem;
      line-height: 1.5;
      color: var(--muted);
    }
    a {
      color: var(--ink);
      text-underline-offset: 0.2em;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">sammytang0119-sys</p>
    <h1>PrimaX</h1>
    <p class="lead">这是我用 GitHub Pages 发布的静态网页。改本地的 index.html，再 push，页面就会更新。</p>
    <p class="lead"><a href="https://github.com/sammytang0119-sys/PrimaX">仓库</a></p>
  </main>
</body>
</html>
